# Appearance
# Gruvbox Dark
foreground #ebdbb2
background #282828
selection_foreground #ebdbb2
selection_background #d65d0e
cursor #bdae93
cursor_text_color #665c54
url_color #458588
color0 #3c3836
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #fbf1c7
font_family Hack Nerd Font Mono
font_size 13
# Match Alacritty's slightly tighter character spacing
modify_font cell_width 95%
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.5
background_opacity 0.9
background_blur 20
hide_window_decorations titlebar-only
window_padding_width 6 3

# Shell and selection
shell /opt/homebrew/bin/fish
shell_integration no-cursor
mouse_hide_wait -1
copy_on_select yes

# Open URLs on cmd+click even inside tmux (grab before the app sees the mouse)
mouse_map cmd+left release grabbed,ungrabbed mouse_click_url

# Font size
map cmd+0 set_font_size 0
map cmd+equal change_font_size all +1
map cmd+plus change_font_size all +1
map cmd+minus change_font_size all -1

# Clipboard and window controls
map cmd+k clear_terminal scrollback active
map cmd+v paste_from_clipboard
map cmd+c copy_to_clipboard
map cmd+h hide_macos_window
map cmd+m minimize_macos_window
map cmd+q quit
map cmd+w close_window
map ctrl+cmd+f toggle_fullscreen

# Clear the visible terminal, matching Ctrl-L in Alacritty
map ctrl+l clear_terminal to_cursor active

# Scrollback
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end
